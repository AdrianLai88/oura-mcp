[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Python MCP server — listens on localhost:8440 only (by design, no login of its own)
[program:mcp-python]
command=uv run oura-mcp --transport http --host 127.0.0.1 --port 8440
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Node.js OAuth 2.1 auth server — proxies authenticated requests to mcp-python
[program:auth-server]
command=sh /app/start-auth.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
