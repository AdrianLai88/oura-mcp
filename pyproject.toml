[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oura-mcp"
version = "1.1.0"
description = "MCP server for the Oura API v2 -- every usercollection resource, not just sleep scores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["oura", "mcp", "sleep", "health", "model-context-protocol"]

dependencies = [
    "mcp>=1.29.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
oura-mcp = "oura_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/oura_mcp/server.py" = ["BLE001"]
